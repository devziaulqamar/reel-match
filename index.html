<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reelmatch — paste keywords, get matching portrait stock videos from Pexels, instantly."
    />
    <title>Reelmatch — Keyword Video Finder</title>
    <script>
      // Resolve the theme before first paint so there's no light/dark flash.
      (function () {
        var stored = localStorage.getItem("rm-theme");
        var theme =
          stored || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
